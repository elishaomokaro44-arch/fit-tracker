name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  app:
    name: App tests and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fit-track
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fit-track/package-lock.json
      - run: npm ci
      - run: npm test
      # Proves the app still compiles for both phones
      - run: npx expo export --platform ios --platform android --output-dir /tmp/expo-export

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fittrack-api ./server
